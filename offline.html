<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline | ODIADEV AI LTD</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #2563eb;
      --accent: #d97706;
      --light: #f8fafc;
      --dark: #1e293b;
      --gray: #64748b;
      --light-gray: #e2e8f0;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      color: var(--dark);
      background-color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    
    .container {
      max-width: 600px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 3rem 2rem;
      margin: 0 auto;
    }
    
    .logo {
      width: 120px;
      height: auto;
      margin-bottom: 1.5rem;
    }
    
    h1 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 1rem;
      font-weight: 700;
    }
    
    p {
      color: var(--gray);
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }
    
    .offline-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      display: block;
      color: var(--accent);
    }
    
    .btn {
      display: inline-block;
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    
    .btn:hover {
      background: var(--secondary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
    }
    
    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      margin-left: 1rem;
    }
    
    .btn-outline:hover {
      background: var(--light-gray);
      color: var(--dark);
    }
    
    .connection-status {
      display: inline-flex;
      align-items: center;
      background: #fef2f2;
      color: #b91c1c;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    
    .connection-status.connected {
      background: #f0fdf4;
      color: #15803d;
    }
    
    .connection-status span {
      width: 8px;
      height: 8px;
      background: #dc2626;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    
    .connection-status.connected span {
      background: #16a34a;
    }
    
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    @media (max-width: 480px) {
      .container {
        padding: 2rem 1.5rem;
      }
      
      h1 {
        font-size: 1.75rem;
      }
      
      .btn-group {
        flex-direction: column;
        width: 100%;
      }
      
      .btn, .btn-outline {
        width: 100%;
        margin: 0.5rem 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="connection-status" id="connectionStatus">
      <span></span>
      You're currently offline
    </div>
    
    <svg class="offline-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    
    <h1>No Internet Connection</h1>
    
    <p>We can't seem to connect to the internet. Please check your connection and try again. Some features may be limited while you're offline.</p>
    
    <div class="btn-group">
      <a href="/" class="btn">Refresh Page</a>
      <a href="#" id="offlineLink" class="btn btn-outline">Try Offline Version</a>
    </div>
  </div>

  <script>
    // Check connection status
    function updateConnectionStatus() {
      const connectionStatus = document.getElementById('connectionStatus');
      
      if (navigator.onLine) {
        connectionStatus.innerHTML = '<span></span> Connection restored! Page will refresh automatically';
        connectionStatus.classList.add('connected');
        
        // Refresh the page when connection is restored
        setTimeout(() => {
          window.location.reload();
        }, 2000);
      } else {
        connectionStatus.innerHTML = '<span></span> You\'re currently offline';
        connectionStatus.classList.remove('connected');
      }
    }
    
    // Listen for online/offline events
    window.addEventListener('online', updateConnectionStatus);
    window.addEventListener('offline', updateConnectionStatus);
    
    // Initial check
    updateConnectionStatus();
    
    // Handle offline link click
    document.getElementById('offlineLink').addEventListener('click', (e) => {
      e.preventDefault();
      caches.match('/')
        .then(response => {
          if (response) {
            return response;
          }
          throw new Error('No cached version available');
        })
        .then(response => response.text())
        .then(html => {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(error => {
          console.error('Error loading offline version:', error);
          alert('Sorry, the offline version is not available. Please check your connection and try again.');
        });
    });
  </script>
</body>
</html>
